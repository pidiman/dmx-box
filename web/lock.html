<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Zadaj PIN</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="start.css">
  <style>
    .lock { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .lock-box { width: 100%; max-width: 340px; display: grid; gap: 22px; justify-items: center; text-align: center; }
    .dots { display: flex; gap: 14px; height: 18px; }
    .dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #4a4a66; }
    .dots i.on { background: var(--accent); border-color: var(--accent); }
    .dots.bad { animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; }
    .pad button { width: 76px; height: 76px; border-radius: 50%; font-size: 28px; font-weight: 600; padding: 0; }
    .pad button.ghost { background: transparent; border-color: transparent; font-size: 15px; color: var(--muted); }
    #msg { min-height: 20px; font-size: 14px; color: #ff8a8a; }
  </style>
</head>
<body>
  <div class="lock">
    <div class="lock-box">
      <div class="brand"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></i><span>Zadaj PIN</span></div>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div id="msg" role="status"></div>
      <div class="pad" id="pad"></div>
      <p class="hint">Zabudnutý PIN sa dá zrušiť na Pi príkazom <code>dmxbox pin reset</code>.</p>
    </div>
  </div>
  <script src="lock.js"></script>
</body>
</html>
