<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DMX-BOX</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="bpm">
      <span id="beat" class="dot"></span>
      <strong id="bpm">---</strong><small>BPM</small>
    </div>
    <div class="track" id="track" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span class="tt"><strong id="track-title"></strong><span id="track-artist"></span></span></div>
    <div class="status">
      <div class="sysg" id="sysg" hidden title="Vyťaženie Raspberry Pi">
        <div class="g" data-k="cpu"><svg viewBox="0 0 38 38" aria-hidden="true"><circle class="bg" cx="19" cy="19" r="15"/><circle class="fg" cx="19" cy="19" r="15" transform="rotate(-90 19 19)"/><text x="19" y="22.5">–</text></svg><small>CPU</small></div>
        <div class="g" data-k="ram"><svg viewBox="0 0 38 38" aria-hidden="true"><circle class="bg" cx="19" cy="19" r="15"/><circle class="fg" cx="19" cy="19" r="15" transform="rotate(-90 19 19)"/><text x="19" y="22.5">–</text></svg><small>RAM</small></div>
        <div class="g" data-k="sd"><svg viewBox="0 0 38 38" aria-hidden="true"><circle class="bg" cx="19" cy="19" r="15"/><circle class="fg" cx="19" cy="19" r="15" transform="rotate(-90 19 19)"/><text x="19" y="22.5">–</text></svg><small>SD</small></div>
        <div class="t" id="sys-temp"><b>–</b>TEPL</div>
      </div>
      <span id="conn" class="live off" role="status" aria-label="Box offline" title="Box offline"></span>
      <button id="menu-btn" class="hamb" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav id="menu" class="menu" hidden>
        <a href="/"><span>⌂</span> Scenáre</a>
        <a href="viz.html" target="_blank"><span>👁</span> Viz – virtuálne svetlá</a>
        <div class="menu-st">
          <div><small>Box</small><b id="st-conn">offline</b></div>
          <div><small>DMX</small><b id="dmx">DMX</b></div>
          <div id="spk-row" hidden><small>Reproduktor</small><b id="st-spk">–</b></div>
          <div class="bt-ad" id="bt-ad-row" hidden>
            <small>Bluetooth adaptér</small>
            <div class="seg" role="radiogroup" aria-label="Bluetooth adaptér">
              <button data-mode="builtin" role="radio">Vstavaný</button>
              <button data-mode="dongle" role="radio">USB dongle</button>
            </div>
            <small class="bt-ad-note" id="bt-ad-note"></small>
          </div>
          <label class="sw-row" id="spk-auto-row" hidden><small title="Po výpadku box reproduktor sám znova pripojí">Auto pripojenie</small>
            <input type="checkbox" id="spk-auto" role="switch"><span class="sw" aria-hidden="true"></span></label>
          <label class="sw-row" id="air-keep-row" hidden><small title="AirPlay hrá do stabilného virtuálneho výstupu – výpadok reproduktora ho nezastaví">AirPlay hrá pri výpadku</small>
            <input type="checkbox" id="air-keep" role="switch"><span class="sw" aria-hidden="true"></span></label>
          <div class="pi" id="menu-sys" hidden><small>Raspberry Pi</small><span><b id="ms-cpu">CPU –</b><b id="ms-ram">RAM –</b><b id="ms-sd">SD –</b><b id="ms-temp">–</b></span></div>
        </div>
      </nav>
    </div>
  </header>

  <section class="pbar" id="pbar" hidden aria-label="Prehrávanie">
    <div class="src"><small id="pb-route">–</small><b id="pb-title">Nič nehrá</b></div>
    <button class="pp" id="pb-pp" aria-label="Pauza"><span class="ic" id="pb-ic"></span><span class="t" id="pb-t">Pauza</span></button>
    <div class="vol">
      <svg class="spk" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      <button id="pb-minus" aria-label="Stíšiť o 5 %"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <input type="range" id="pb-vol" min="0" max="100" step="1" value="50" aria-label="Hlasitosť">
      <output id="pb-volout">– %</output>
      <button id="pb-plus" aria-label="Zosilniť o 5 %"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </section>

  <section class="spectrum" aria-label="Vizualizácia hudby">
    <div class="spec-row">
      <div class="spec-ch" aria-hidden="true"><span>L</span><span>R</span></div>
      <canvas id="spec" height="104" role="img" aria-label="Spektrum ľavého a pravého kanála: basy vľavo, výšky vpravo"></canvas>
    </div>
    <div class="spec-axis" aria-hidden="true"><span>BASY</span><span>STREDY</span><span>VÝŠKY</span></div>
  </section>

  <main>
    <section class="wheels">
      <div class="wheel-box">
        <h2>Farby <em id="cur-color"></em></h2>
        <button class="info-btn" data-info="color" aria-label="Čo robia efekty farieb" aria-haspopup="dialog"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
        <div class="wheel" id="wheel-color"></div>
      </div>
      <div class="wheel-box">
        <h2>Pohyb <em id="cur-move"></em></h2>
        <button class="info-btn" data-info="move" aria-label="Čo robia efekty pohybu" aria-haspopup="dialog"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
        <div class="wheel" id="wheel-move"></div>
      </div>
    </section>

    <section class="row tempo">
      <button id="auto" class="toggle">AUTO</button>
      <select id="auto-bars" aria-label="Takty pre auto">
        <option value="8">8 taktov</option><option value="16">16 taktov</option><option value="32">32 taktov</option>
      </select>
      <button data-bpm="0.5">½×</button>
      <button data-bpm="2">2×</button>
      <button id="tap">TAP</button>
      <button id="bpm-auto" title="Späť na automatické BPM">A</button>
    </section>

    <section class="style">
      <h2>Štýl hudby <em id="style-now"></em></h2>
      <div class="styles" id="styles"></div>
      <div class="style-info"><span id="style-detect">rozpoznávam…</span><span id="section" class="pill">—</span></div>
    </section>

    <section class="hold">
      <button id="strobe" class="big strobe">STROBO</button>
      <button id="fog" class="big fogbtn">DYM<small id="fog-info"></small></button>
      <button id="blackout" class="big black toggle">BLACKOUT</button>
    </section>

    <section class="sliders">
      <label>Master <input type="range" id="master" min="0" max="1" step="0.01"></label>
      <label>Veľkosť <input type="range" id="size" min="0" max="1" step="0.01"></label>
      <label>Mäkkosť <input type="range" id="fade" min="0" max="1" step="0.01"></label>
      <div class="seg" id="speed">
        <span>Rýchlosť</span>
        <button data-v="0.5">½×</button><button data-v="1">1×</button><button data-v="2">2×</button>
      </div>
    </section>

    <section>
      <h2>Paleta</h2>
      <div class="chips" id="palettes"><button class="chip" id="pal-style" data-p="__style"><span class="sw"><i style="background:linear-gradient(90deg,#f00,#f0f,#00f,#0f0)"></i></span><b>podľa štýlu</b></button></div>
      <div class="row manual">
        <label class="picker">Vlastná farba <input type="color" id="manual" value="#ff0040"></label>
        <button id="manual-off">Zrušiť</button>
      </div>
    </section>

    <section>
      <h2>Presety <small>ťuk = načítať, podrž = uložiť</small></h2>
      <div class="presets" id="presets"></div>
    </section>

    <details class="settings">
      <summary>Nastavenia</summary>
      <label>Light delay <output id="delay-out">0 ms</output>
        <input type="range" id="delay" min="0" max="500" step="10"></label>
      <label class="check"><input type="checkbox" id="laser"> Laser</label>
      <label class="check"><input type="checkbox" id="uv"> UV podklad (Belka)</label>
      <label class="check"><input type="checkbox" id="line_in"> Line-in (UCA202 IN)</label>
      <label class="check"><input type="checkbox" id="fog_auto"> Auto dym na drop</label>
      <label>Dĺžka auto výstreku <output id="burst-out">3 s</output>
        <input type="range" id="fog_burst_s" min="1" max="8" step="0.5"></label>
    </details>
  </main>

  <div id="info-sheet" class="sheet-bg" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
      <header><span class="sh-i" aria-hidden="true">i</span><h3 id="sh-title"></h3><button class="x" id="sh-close" aria-label="Zavrieť">✕</button></header>
      <p class="intro" id="sh-intro"></p>
      <ul class="fxl" id="sh-list"></ul>
    </section>
  </div>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
