<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DMX-BOX</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="start.css">
</head>
<body>
  <div class="page">
    <div class="bar">
      <div class="brand"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></i>DMX-BOX</div>
      <div class="row">
        <a class="pill" href="/ovladanie">Ovládanie →</a>
        <a class="iconbtn" href="box.html" aria-label="Nastavenia boxu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
      </div>
    </div>

    <!-- domov: výber scenára -->
    <section id="home" class="page" style="padding: 0">
      <div class="chips" id="chips"><span class="chip-s"><span class="spin"></span> zisťujem stav…</span></div>
      <div>
        <h1>Ako dnes pustíš hudbu?</h1>
        <p class="lead">Vyber scenár. Box podľa neho nastaví vstup hudby, výstup zvuku aj správanie svetiel.</p>
      </div>
      <button class="resume" id="resume" hidden>
        <span><span class="t">Ako minule</span><strong id="resume-name"></strong><em id="resume-sub"></em></span>
        <b><svg width="20" height="20" viewBox="0 0 24 24" fill="#ff2e7e" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></b>
      </button>
      <h2 class="sec-title">Scenáre</h2>
      <div class="cards" id="cards"></div>
      <p class="hint">Box si zapamätá posledný scenár. Wi-Fi, Bluetooth, zvuk a aktualizácie nájdeš v <a href="box.html">nastaveniach boxu</a>, bez počítača.</p>
    </section>

    <!-- sprievodca scenárom -->
    <section id="setup" class="page" style="padding: 0" hidden>
      <button class="back" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Scenáre</button>
      <div><h1 id="s-title"></h1><p class="lead" id="s-desc"></p></div>
      <div id="steps" style="display: grid; gap: 14px"></div>
      <button class="go" id="go"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Spustiť show</button>
    </section>
  </div>
  <div id="toast" role="status"></div>
  <script src="start.js"></script>
</body>
</html>
