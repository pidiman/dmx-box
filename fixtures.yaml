# DMX-BOX – kanálové mapy svetiel (univerz 1)
# Čísla kanálov sú relatívne (1 = štartová adresa svetla).
# Zdroj: živé testy v QLC+ Simple Desk / belka-test (okt 2026) + manuály.

fixtures:

  parbar:
    name: MAX PartyBar4 (LED Parbar 4-way 3x 4-in-1 RGBW)
    start: 1            # displej d001
    mode: 8ch
    footprint: 8
    # Celá lišta má jednu farbu – jednotlivé pary sa cez DMX ovládať nedajú.
    channels:
      macro: 1          # 0–10 DMX RGBW | 11–50 static | 51–100 jump | 101–150 fade | 151–200 sound | 201–255 strobe
      color_macro: 2    # výber farebného makra / programu
      speed: 3          # rýchlosť makra, pomaly → rýchlo
      dimmer: 4         # master dimmer
      red: 5
      green: 6
      blue: 7
      white: 8
    ranges:
      macro:
        dmx: [0, 10]
        static: [11, 50]
        jump: [51, 100]
        fade: [101, 150]
        sound: [151, 200]
        strobe: [201, 255]
    verified: live      # 1, 4–8 naživo; 2–3 podľa manuálu

  movinghead:
    name: Fractal Lights Mini LED Gobo Spot 30W
    start: 9            # displej A009
    mode: 12ch
    footprint: 12
    # V menu musí byť SLnd → SL 1, inak svetlo ignoruje DMX.
    # Motor nestíha plynulé kruhy na beat → pohyb skokmi medzi pozíciami.
    channels:
      pan: 1
      pan_fine: 2
      tilt: 3
      tilt_fine: 4
      color: 5
      gobo: 6
      strobe: 7
      dimmer: 8         # pri 0 nesvieti
      pt_speed: 9       # 0 = rýchlo, 255 = pomaly
      program: 10       # 0–59 nič (DMX), 60–159 auto, 160–255 sound
      reset: 11         # 250–255 reset
      led_ring: 12      # 0 vyp, 1–255 efekty (nie je v manuáli, zmapované naživo)
    values:
      color:
        white: 0
        red: 10
        yellow: 20
        blue: 30
        green: 40
        orange: 50
        pink: 60
        cyan: 70
        half_colors: [80, 139]
        rainbow: [140, 255]
      gobo:
        open: 0
        gobos: [8, 16, 24, 32, 40, 48, 56]
        shake: [72, 127]
        rotate: [128, 255]
    limits:
      pan: [0, 255]
      tilt: [40, 200]   # aby nesvietil do očí / do stropu – doladiť v miestnosti
    verified: live      # pan/tilt/color/gobo/dimmer/led_ring naživo; zvyšok podľa manuálu

  belka:
    name: Light4Me BELKA Laser Strobe LED PAR Derby UV
    start: 21           # displej d021
    mode: 12ch
    footprint: 12
    # Má UV LED aj biele strobo. V teste 25. 10. sa UV na žiadnom z 12 kanálov
    # samostatne neprejavilo → UV kanál treba nájsť (iný rozsah na 11/12,
    # iný DMX mód lišty, alebo UV len vo vstavaných programoch).
    channels:
      derby_red: 1
      derby_green: 2
      derby_blue: 3
      derby_white: 4
      derby_motor: 5    # prejaví sa až pri rozsvietenom derby
      par_red: 6
      par_green: 7
      par_blue: 8
      par_white: 9
      laser: 10         # 0–63 vyp | 64–127 červený | 128–197 zelený | 198–255 oba
      strobe: 11        # jas stroba (podľa testu; možno zdieľa UV – overiť)
      strobe_speed: 12  # rýchlosť stroba
      uv: null          # TODO: overiť naživo
    ranges:
      laser:
        off: [0, 63]
        red: [64, 127]
        green: [128, 197]
        both: [198, 255]
    verified: partial   # belka-test 25. 10. 2026; UV chýba, rozsahy lasera podľa manuálu

# Spolu kanály 1–32. Posielať len 32 kanálov, nie celý univerz (viď docs/PROJEKT.md, DMX výstup).
universe_channels: 32
