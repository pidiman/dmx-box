// DMX-BOX: AirPlay prijímač. install.sh kopíruje do ~/.config/shairport-sync.conf
general = {
  name = "%h";                    // meno boxu (hostname), napr. fajny-dmx-box
  output_backend = "pa";          // PipeWire (pulse) → predvolený výstup boxu
  interpolation = "soxr";
  drift_tolerance_in_seconds = 0.010;
  mpris_service_bus = "Session";  // play/pauza iPadu z appky boxu (dmxbox/player.py)
};

sessioncontrol = {
  allow_session_interruption = "yes";   // iný iPhone môže prevziať prehrávanie
  session_timeout = 20;
};

pa = {
  application_name = "AirPlay";
};

metadata = {
  enabled = "yes";                // názov skladby pre appku (dmxbox/nowplaying.py)
  include_cover_art = "no";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};
